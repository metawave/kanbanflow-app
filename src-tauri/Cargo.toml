[package]
name = "kanbanflow-app"
# the app version is taken from package.json (see tauri.conf.json)
version = "0.0.0"
description = "A application showing the Kanbanflow Website/App"
authors = ["Marcel Ryser"]
license = "MIT"
repository = "https://github.com/metawave/kanbanflow-app"
edition = "2021"
publish = false

[lib]
name = "kanbanflow_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2.13.3"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
